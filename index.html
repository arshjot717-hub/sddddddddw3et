<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 560px;
      text-align: center;
      background: #1e293b;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    a.button {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      transition: opacity 0.2s;
    }

    a.button:hover {
      opacity: 0.85;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">● Live on GitHub Pages</span>
    <h1>Hello, world!</h1>
    <p>This site is deployed automatically with GitHub Actions every time you push to the <code>main</code> branch.</p>
    <a class="button" href="https://pages.github.com" target="_blank" rel="noopener">Learn about GitHub Pages</a>
    <footer>Built with a simple static site workflow.</footer>
  </div>
</body>
</html>
